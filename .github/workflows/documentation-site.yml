name: Publish documentation website

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'docs/**'
      - '**/*.md'
      - '.github/workflows/documentation-site.yml'
  release:
    types: [published, edited]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: engineos-documentation-production
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'enginsoysal/codename-engine-os'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: engineos-docs
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out current documentation source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          persist-credentials: false
      - name: Check frontend syntax and build public snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --check website/public/app.js
          python3 website/build.py --output build/site
      - name: Authenticate through short-lived GitHub OIDC
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3
        with:
          client-id: ${{ vars.ENGINEOS_DOCS_AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.ENGINEOS_DOCS_AZURE_TENANT_ID }}
          subscription-id: ${{ vars.ENGINEOS_DOCS_AZURE_SUBSCRIPTION_ID }}
      - name: Publish static website files
        run: |
          az storage blob upload-batch \
            --account-name stengineosdocs46147764 --auth-mode login \
            --destination '$web' --source build/site --overwrite true \
            --content-cache-control 'public,max-age=0,must-revalidate' \
            --only-show-errors --output none
      - name: Verify published bytes and frozen OS evidence
        run: |
          python3 website/check.py \
            --url https://stengineosdocs46147764.z6.web.core.windows.net \
            --output build/website-publication-results.json
          echo 'Published https://codenameenginos.brixcanvas.com' >> "$GITHUB_STEP_SUMMARY"
          echo 'Verified the dedicated static origin and frozen M4.5 evidence.' >> "$GITHUB_STEP_SUMMARY"
