<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" role="img"><title>Engacer OS installation disk-selection concept</title><rect x="0" y="0" width="1280" height="800" rx="0" fill="#15313e"/><path d="M0 610 Q420 260 810 560 T1280 370 V800 H0Z" fill="#204c55"/><text x="30" y="40" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="600" fill="#e5f8f2">E   Engacer OS</text><text x="30" y="66" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#a7c7c9">Your space. Your system.</text><rect x="155" y="111" width="970" height="590" rx="14" fill="#f9fbfc"/><rect x="155" y="111" width="222" height="590" rx="14" fill="#e6f1ef"/><text x="183" y="159" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="600" fill="#173042">ENGACER OS SETUP</text><text x="183" y="188" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#607685">Make yourself at home.</text><text x="187" y="228" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#173042">1   Welcome</text><text x="187" y="276" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#173042">2   Keyboard</text><rect x="172" y="300" width="190" height="38" rx="7" fill="#bdeedc"/><text x="187" y="324" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="600" fill="#173042">3   Your disk</text><text x="187" y="372" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#173042">4   Components</text><text x="187" y="420" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#173042">5   Your style</text><text x="187" y="468" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#173042">6   Review</text><text x="187" y="516" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#173042">7   Installing</text><text x="187" y="564" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#173042">8   Restart</text><text x="411" y="160" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" font-weight="600" fill="#607685">STEP 3 OF 8</text><text x="410" y="211" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="28" font-weight="600" fill="#173042">Where should we install Engacer OS?</text><text x="411" y="244" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#607685">Choose a disk from the list. Disk tools lets you review its partitions.</text><rect x="411" y="276" width="677" height="222" rx="8" fill="#fff" stroke="#dce5eb"/><text x="430" y="305" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" font-weight="600" fill="#607685">DISKS AND PARTITIONS</text><text x="999" y="305" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" font-weight="600" fill="#607685">CAPACITY</text><rect x="419" y="324" width="661" height="71" rx="5" fill="#d3f4e8" stroke="#299775"/><text x="438" y="349" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="600" fill="#173042">(o)   Disk 1</text><text x="481" y="376" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#607685">SATA  |  Empty disk  |  Ready to install</text><text x="1004" y="363" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#173042">20 GiB</text><text x="438" y="425" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#173042">( )   USB drive</text><text x="481" y="452" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#607685">File transfer only - not an installation target</text><text x="1013" y="437" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#173042">8 GiB</text><rect x="411" y="518" width="142" height="40" rx="7" fill="#fff" stroke="#dce5eb"/><text x="427" y="544" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="600" fill="#173042">Disk tools...</text><text x="411" y="589" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#607685">Your selected disk will be reviewed before any changes are made.</text><rect x="411" y="637" width="104" height="40" rx="7" fill="#fff" stroke="#dce5eb"/><text x="427" y="663" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="600" fill="#173042">Back</text><rect x="961" y="637" width="127" height="40" rx="7" fill="#67e4bc" stroke="#dce5eb"/><text x="977" y="663" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="600" fill="#173042">Next</text><rect x="825" y="12" width="435" height="34" rx="7" fill="#eff7f5"/><text x="839" y="34" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" font-weight="600" fill="#607685">M11.0 DESIGN CONCEPT - NOT A VM CAPTURE</text></svg>