<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Engine OS — Setup design reference</title>
<style>*{box-sizing:border-box}body{margin:0;padding:32px;background:#173340;color:#193746;font:18px/1.5 system-ui,sans-serif;min-height:100vh;display:grid;place-items:center}main{width:min(1160px,100%);min-height:700px;border-radius:18px;overflow:hidden;background:#f8fafb;display:grid;grid-template-columns:210px 1fr}aside{padding:32px 22px;background:#102c3b;color:#b4ced8}aside strong{font-size:25px;color:white}ol{list-style:none;padding:0;margin-top:50px}li{padding:12px;border-radius:8px;font-size:16px}.active{background:#264e5d;color:white}section{padding:32px 36px;display:flex;flex-direction:column}article{flex:1}h1{font-size:34px;line-height:1.2}p,small{color:#506976}button,input{font:inherit}button{border:2px solid #bacbd4;border-radius:9px;background:white;color:#193746;padding:12px 20px;min-height:52px;cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #19846e;outline-offset:3px}button:disabled{color:#71838d;background:#eff4f7;cursor:default}.primary{background:#62e5bd;border-color:#62e5bd}footer{margin-top:25px;border-top:1px solid #dce6ec;padding-top:18px;display:flex;justify-content:space-between}.list{border:2px solid #c5d5dd;border-radius:10px;background:white;margin:30px 0;overflow:hidden}.list header{padding:16px;font-size:14px}.disk{width:100%;border:0;border-radius:0;display:flex;justify-content:space-between;text-align:left;padding:20px}.selected{background:#e1f5ec;box-shadow:inset 4px 0 #229d80}.panel{padding:24px;background:#eaf0f4;border-radius:12px;margin:28px 0}.art{padding:32px;border-radius:12px;background:#e4f2ed;text-align:center;font-size:48px}input[type=text]{width:100%;padding:14px;border:2px solid #bacbd4;border-radius:8px}#notice{color:#c4d9e2;font-size:14px;text-align:center;max-width:1160px}progress{width:100%;height:5px;accent-color:#229d80}@media(max-width:750px){body{padding:12px}main{grid-template-columns:1fr}aside{display:none}section{padding:24px}}</style>
<div><main><aside><strong>Engine OS</strong><p style="color:#b4ced8">SETUP</p><ol id="steps"></ol></aside><section><small id="number"></small><progress id="bar" max="7"></progress><article id="page"></article><footer><button id="back">Back</button><button id="next" class="primary">Next</button></footer></section></main><p id="notice">Design reference only. This webpage cannot install an OS, access disks or restart your computer. Use the released ISO to test the real native wizard.</p></div><script>
let step=0,selected=false;const names=['Welcome','Choose a disk','Your apps','Your style','Review','Installing','Ready'];const page=document.querySelector('#page'),next=document.querySelector('#next'),back=document.querySelector('#back');
function render(){document.querySelector('#steps').innerHTML=names.map((n,i)=>`<li class="${i===step?'active':''}">${i+1} &nbsp; ${n}</li>`).join('');document.querySelector('#number').textContent=`STEP ${step+1} OF 7`;document.querySelector('#bar').value=step+1;next.disabled=step===1&&!selected;back.disabled=step===0||step>=5;next.textContent=step===4?'Preview installation':step===5?'Preview completion':step===6?'Preview restart':'Next';
const pages=['<h1>Let’s set up Engine OS.</h1><p>A few simple choices. Your own desktop, ready to use.</p><div class="art">▣</div><p>1. Choose where to install<br>2. Make it yours<br>3. Review, install and restart</p>',`<h1>Choose an installation disk</h1><p>Click a row in the list. The selected row is highlighted.</p><div class="list"><header>INSTALLATION DISKS</header><button class="disk ${selected?'selected':''}" aria-pressed="${selected}"><span>${selected?'◉':'○'} &nbsp; Demo Disk 1 — empty SATA disk</span><span>20 GiB</span></button></div><p>${selected?'The real installer prepares an empty disk automatically.':'Select a disk above to enable Next.'}</p>`,'<h1>Your everyday essentials.</h1><div class="art">▣</div><p>Desktop, Files and Settings are included. Optional apps can be removed and reinstalled later.</p>','<h1>Make yourself at home.</h1><p>In the native installer, enter your name and choose Mint, Lavender or Amber. Back keeps your choices.</p>','<h1>Ready to install?</h1><div class="panel">Demo Disk 1 — 20 GiB<br>Account: Owner</div><p>The real installer asks for separate permission before erasing existing files.</p>','<h1>Making it yours.</h1><div class="art">▣</div><p>This is an illustration. No files are copied by this preview. The real OS shows verified stages and progress.</p>','<h1>You’re ready to go.</h1><div class="art">▣</div><p>In the real OS, Restart starts the installed hard-disk system. The matching ISO may stay connected.</p><p>This browser preview has not installed anything.</p>'];page.innerHTML=pages[step];if(step===1)page.querySelector('.disk').onclick=()=>{selected=true;render()}}
back.onclick=()=>{step--;render()};next.onclick=()=>{step=step===6?0:step+1;render()};render();</script></html>
