<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Engine OS · Setup design preview</title>
<style>
:root{--accent:#62e5bd;--bg:#101b21;--panel:#17272e;--muted:#9aaeb6}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 15% 10%,#254a4a,transparent 55%),#0a141a;color:#f3f8f7;font:16px system-ui,sans-serif;min-height:100vh;display:grid;place-items:center;padding:28px}button,input,select{font:inherit}button{cursor:pointer}main{width:min(1120px,100%);border:1px solid #3b545c;border-radius:22px;overflow:hidden;background:var(--bg);box-shadow:0 30px 100px #0007}header{padding:23px 32px;border-bottom:1px solid #2a3b43;display:flex;align-items:center;justify-content:space-between}.brand{font-size:21px;font-weight:700;letter-spacing:-.6px}.mark{display:inline-grid;place-items:center;color:var(--accent);border:1px solid #527d75;width:32px;height:32px;border-radius:9px;margin-right:12px}.tag{font-size:12px;color:var(--accent);background:#203c37;padding:7px 11px;border-radius:30px}.layout{display:grid;grid-template-columns:245px 1fr;min-height:540px}aside{background:#122027;padding:35px 25px}aside p{color:var(--muted);font-size:12px;letter-spacing:1.5px;margin:0 0 25px}.step{display:flex;gap:13px;align-items:center;color:var(--muted);margin-bottom:23px;font-size:14px}.step span{width:28px;height:28px;display:grid;place-items:center;border:1px solid #455960;border-radius:50%;font-size:12px}.step.active{color:white}.step.active span{background:var(--accent);border-color:var(--accent);color:#09251b}.step.done span{border-color:var(--accent);color:var(--accent)}article{padding:42px 45px}small,.muted{color:var(--muted)}h1{font-size:38px;line-height:1.15;letter-spacing:-1.3px;margin:12px 0 17px}p{line-height:1.65}.eyebrow{font-size:12px;color:var(--accent);letter-spacing:1.7px}.cards{display:grid;gap:12px;margin:25px 0}.card{display:block;border:1px solid #3d565e;border-radius:12px;padding:17px 20px;background:var(--panel)}.card strong{display:block;margin-bottom:5px}.card small{display:block;line-height:1.5}.notice{border-left:3px solid var(--accent);padding:0 15px;margin-top:25px;font-size:14px;color:var(--muted)}footer{display:flex;gap:12px;align-items:center;padding:21px 32px;border-top:1px solid #2a3b43}footer small{margin-right:auto}button{border-radius:8px;border:1px solid #41555c;padding:11px 24px;background:transparent;color:white}button.primary{background:var(--accent);border-color:var(--accent);color:#10291f;font-weight:650}button:disabled{opacity:.35;cursor:default}input[type=text],select{background:#0c191f;color:white;border:1px solid #49626a;border-radius:7px;padding:10px;width:100%;margin-top:8px}input[type=checkbox],input[type=radio]{accent-color:var(--accent);margin-right:10px}.swatches{display:flex;gap:12px;margin:20px 0}.swatches button{width:40px;height:40px;padding:0;border-radius:50%;border:3px solid #ffffff44}.progress{height:10px;background:#35464c;border-radius:10px;margin:30px 0;overflow:hidden}.progress div{background:var(--accent);height:100%;transition:width .3s}#preview-note{font-size:12px;text-align:center;color:#92a8b1;padding:14px;max-width:1000px}label{cursor:pointer}.inline{display:flex;justify-content:space-between;gap:15px}.inline strong{display:inline}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid white;outline-offset:4px}@media(max-width:750px){body{padding:10px}.layout{grid-template-columns:1fr}aside{display:none}article{padding:25px}h1{font-size:30px}footer{padding:18px}.tag{display:none}}
</style>
<div><main><header><div class="brand"><span class="mark">E</span>Engine OS</div><span class="tag">INSTALLER DESIGN PREVIEW</span></header><div class="layout"><aside><p>MAKE IT YOURS</p><div id="steps"></div><small>Your system.<br>Your choices.</small></aside><article id="page"></article></div><footer><small id="foot">No disks are accessed in this preview.</small><button id="back">Back</button><button id="next" class="primary">Next →</button></footer></main><div id="preview-note">Interactive design preview · Browser simulation only · No installation, disk access or packages are performed.</div></div>
<script>
const names=['Welcome','Your disk','Your components','Your style','Review','Installing','Finish'];let step=0,progress=0,timer;
const config={user:'Owner',disk:'Demo disk · 20 GiB',calculator:true,editor:true,guide:true,theme:'Dark',accent:'#62e5bd'};
const page=document.getElementById('page'),back=document.getElementById('back'),next=document.getElementById('next');
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){document.documentElement.style.setProperty('--accent',config.accent);document.getElementById('steps').innerHTML=names.map((n,i)=>`<div class="step ${i===step?'active':i<step?'done':''}"><span>${i<step?'✓':i+1}</span>${n}</div>`).join('');back.disabled=step===0||step>=5;next.disabled=step===5;next.textContent=step===4?'Preview installation →':step===6?'Finish':'Next →';
const intro=(a,b,c)=>`<div class="eyebrow">${a}</div><h1>${b}</h1><p class="muted">${c}</p>`;
if(step===0)page.innerHTML=intro('WELCOME TO ENGINE OS','A fresh start.<br>Made yours.','A guided setup, with room to choose. We will show you what changes before anything is installed.')+'<div class="cards"><div class="card"><strong>Simple when you want it</strong><small>Follow the recommended choices and keep moving.</small></div><div class="card"><strong>Flexible where it matters</strong><small>Choose your components and style. Change supported preferences later.</small></div></div><div class="notice">This is a proposed M6 interface. Optional apps, themes and account setup shown here are design choices, not available OS features yet.</div>';
if(step===1)page.innerHTML=intro('STEP 2 / 7','Choose your destination.','A real installer will detect available disks. This preview uses one fictional disk.')+'<div class="cards"><label class="card"><input type="radio" checked name="disk"> <strong style="display:inline">Demo disk · 20 GiB</strong><small style="margin-top:10px">Proposed layout: BIOS boot, EFI, two system slots and a data volume using the remaining aligned capacity.</small></label></div><div class="notice">The real install will prepare the selected disk. Existing contents may be lost. Here, no device is opened and no data is changed.</div>';
if(step===2)page.innerHTML=intro('STEP 3 / 7','Keep what you need.','Optional apps can be removed independently. Core requirements will always be explained.')+'<div class="cards"><div class="card"><strong>Base system · Required</strong><small>Kernel, boot, storage and the supported recovery path. Required for an installed system to function.</small></div>'+[['calculator','Calculator','Optional. Removing it must not affect the desktop or other apps.'],['editor','Text editor','Optional. Other editors can provide document editing.'],['guide','Welcome guide','Optional. Help remains available through the published handbook.']].map(([k,n,d])=>`<label class="card"><input type="checkbox" data-option="${k}" ${config[k]?'checked':''}><strong style="display:inline">${n}</strong><small>${d}</small></label>`).join('')+'</div><small>These app choices demonstrate the planned dependency policy. They do not install working apps in the current OS.</small>';
if(step===3)page.innerHTML=intro('STEP 4 / 7','Make yourself at home.','Preview the setup accent now. Account and installed-desktop preferences require M6/M7 implementation.')+`<label>Your display name<input id="user" type="text" maxlength="32" value="${esc(config.user)}"></label><p>Setup accent</p><div class="swatches">${['#62e5bd','#9caeff','#f4c47c','#f4a6c5'].map(c=>`<button aria-label="Accent ${c}" data-color="${c}" style="background:${c}"></button>`).join('')}</div><label>Desktop appearance · proposed<select id="theme"><option ${config.theme==='Dark'?'selected':''}>Dark</option><option ${config.theme==='Light'?'selected':''}>Light</option><option ${config.theme==='System default'?'selected':''}>System default</option></select></label><div class="notice">Your own distro should be able to supply defaults, branding and supported components without changing the safety rules.</div>`;
if(step===4)page.innerHTML=intro('STEP 5 / 7','Everything look right?','Go back to change any choice. The following action only simulates progress.')+`<div class="cards"><div class="card inline"><span>Destination</span><strong>${esc(config.disk)}</strong></div><div class="card inline"><span>Display name</span><strong>${esc(config.user||'Owner')}</strong></div><div class="card inline"><span>Appearance</span><strong>${esc(config.theme)}</strong></div><div class="card"><strong>Optional components</strong><small>${[config.calculator?'Calculator':'',config.editor?'Text editor':'',config.guide?'Welcome guide':''].filter(Boolean).join(' · ')||'None selected'}</small></div></div><div class="notice">Real installation needs an explicit final destructive confirmation and target revalidation. This preview has no install backend.</div>`;
if(step===5)page.innerHTML=intro('SIMULATED PROGRESS','Getting things ready.','This animation demonstrates the proposed progress screen. No files are copied.')+`<div class="progress"><div style="width:${progress}%"></div></div><strong>${progress}% · Preview animation</strong><p class="muted">In the real installer, each progress stage must reflect completed, verified work.</p>`;
if(step===6)page.innerHTML=intro('PREVIEW COMPLETE','Your choices.<br>Ready for review.','This concludes the interface demo. Nothing was installed or saved to a disk.')+'<div class="cards"><div class="card"><strong>What the real Finish screen must mean</strong><small>Verified system files, independent boot and persistent user setup. Only then may Engine OS say installation is complete.</small></div></div><div class="notice">The desktop itself belongs to M7. This preview is not a desktop or a bootable installer.</div>';
page.querySelectorAll('[data-option]').forEach(el=>el.onchange=()=>config[el.dataset.option]=el.checked);page.querySelectorAll('[data-color]').forEach(el=>el.onclick=()=>{config.accent=el.dataset.color;render()});const u=page.querySelector('#user');if(u)u.oninput=()=>config.user=u.value;const t=page.querySelector('#theme');if(t)t.onchange=()=>config.theme=t.value;
}
back.onclick=()=>{if(step>0&&step<5){step--;render()}};
next.onclick=()=>{if(step===6){step=0;render();return}if(step===5)return;step++;render();if(step===5){progress=0;timer=setInterval(()=>{progress=Math.min(100,progress+10);if(progress===100){clearInterval(timer);step=6}render()},160)}};render();
</script></html>
